<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giriş Yap - INEPROF ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #1a202c;
            background-image: linear-gradient(135deg, #1a202c 0%, #2b3a55 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            padding: 2.25rem 2rem;
        }
        .login-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #2b6cb0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
        }
        .login-icon i { color: #fff; font-size: 1.75rem; }
        .brand-title { font-weight: 800; letter-spacing: 0.5px; color: #1a202c; }
        .brand-sub { color: #718096; font-size: 0.85rem; }
        .btn-login {
            background-color: #2b6cb0;
            border: none;
            font-weight: 700;
        }
        .btn-login:hover { background-color: #1a365d; }
        .form-control:focus { border-color: #2b6cb0; box-shadow: 0 0 0 0.2rem rgba(43,108,176,0.2); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-3">
        <div class="login-icon"><i class="bi bi-box-seam"></i></div>
        <div class="fs-4 brand-title">INEPROF ERP</div>
        <div class="brand-sub">Cari Takip &amp; Teklif Sistemi</div>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
        {% if request.args.get('next') %}
        <input type="hidden" name="next" value="{{ request.args.get('next') }}">
        {% endif %}
        <div class="mb-3">
            <label class="form-label fw-bold small">Kullanıcı Adı</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Kullanıcı adınız" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold small">Şifre</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Şifreniz" required>
            </div>
        </div>
        <button type="submit" class="btn btn-login btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Giriş Yap
        </button>
    </form>
</div>

</body>
</html>
